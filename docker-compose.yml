services:
  db:
    image: pgvector/pgvector:pg16
    container_name: secondbrain-db
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: secondbrain
      POSTGRES_DB: secondbrain
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with any local Homebrew postgres
    volumes:
      - secondbrain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  secondbrain_pgdata:
